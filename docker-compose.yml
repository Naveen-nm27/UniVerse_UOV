services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command: ["--default-time-zone=+05:30"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD using docker/.env}
      MYSQL_DATABASE: universe_uov_v04
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/server/database/schema-v04.sql:/docker-entrypoint-initdb.d/01-schema-v04.sql:ro

volumes:
  mysql_data:
